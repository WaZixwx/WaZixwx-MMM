name: Build & Publish WaZixwx-MMM Studio Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "maintenance/*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Zero-Config Windows Workstation (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & DirectML GPU Runtime (Two-Stage Zero-Build-Error Mode)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install onnxruntime-directml onnx onnx2torch einops julius beartype rotary-embedding-torch ml-collections tqdm requests six pyyaml pyinstaller
          pip install --no-deps audio-separator demucs

      - name: Build Standalone Windows GUI Executable
        run: |
          pyinstaller scripts/mmm.spec --clean -y

      - name: Bundle Portable FFmpeg & Pre-Cache Default ONNX Vocal/Inst Stem Model
        shell: pwsh
        run: |
          $ffmpegPath = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if ($ffmpegPath) {
            Copy-Item $ffmpegPath -Destination "dist/WaZixwx-MMM-Studio/" -Force
          }
          New-Item -ItemType Directory -Force -Path "dist/WaZixwx-MMM-Studio/models/audio_separator" | Out-Null
          python -c "from audio_separator.separator import Separator; s = Separator(model_file_dir='dist/WaZixwx-MMM-Studio/models/audio_separator', info_only=False); s.load_model('UVR-MDX-NET-Inst_HQ_3.onnx')" || true

      - name: Archive Windows Release Bundle
        run: |
          Compress-Archive -Path dist/WaZixwx-MMM-Studio/* -DestinationPath dist/WaZixwx-MMM-Studio-Windows-x64.zip -Force

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaZixwx-MMM-Studio-Windows-x64
          path: dist/WaZixwx-MMM-Studio-Windows-x64.zip
          if-no-files-found: error

      - name: Publish Windows Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v7.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('WaZixwx-MMM Studio {0}', github.ref_name) || 'WaZixwx-MMM Studio v7.0.0 Sovereign (Zero-Config Out-of-the-Box Release)' }}
          body: |
            ### 🎛️ WaZixwx-MMM Studio v7.0.0 Sovereign — Cubic-Hermite De-Clipping, Sub-1.1 Human-Baseline RVQ De-Gridding, 7-Stem Separation & 7-Domain Anti-AI Workstation
            - **100% Zero-Config Out-of-the-Box Windows Release**: Download `WaZixwx-MMM-Studio-Windows-x64.zip`, extract anywhere, and double-click `WaZixwx-MMM-Studio.exe` (includes Windows High-DPI scaling, portable FFmpeg, DirectML GPU acceleration, pre-cached ONNX neural stem separator, Stage-0 Cubic-Hermite De-Clipper, Stage-12 Post-48kHz OLA-Closed-Loop RVQ Lock Nullifier to `< 1.15` human baseline, and custom 7-stem export checkboxes).
            - **Linux Standalone Bundle**: Download `WaZixwx-MMM-Studio-Linux-x64.tar.gz`.
          files: dist/WaZixwx-MMM-Studio-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Workstation Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Audio & GUI Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg python3-tk

      - name: Install Dependencies (Two-Stage Zero-Build-Error Mode)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install onnxruntime onnx onnx2torch einops julius beartype rotary-embedding-torch ml-collections tqdm requests six pyyaml pyinstaller
          pip install --no-deps audio-separator demucs

      - name: Build Standalone Linux Executable
        run: |
          pyinstaller mmm/gui.py --name WaZixwx-MMM-Studio --onedir --clean -y

      - name: Archive Linux Release Bundle
        run: |
          mkdir -p dist/WaZixwx-MMM-Studio/models/audio_separator
          tar -czvf dist/WaZixwx-MMM-Studio-Linux-x64.tar.gz -C dist/WaZixwx-MMM-Studio .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaZixwx-MMM-Studio-Linux-x64
          path: dist/WaZixwx-MMM-Studio-Linux-x64.tar.gz

      - name: Publish Linux Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v7.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('WaZixwx-MMM Studio {0}', github.ref_name) || 'WaZixwx-MMM Studio v7.0.0 Sovereign (Zero-Config Out-of-the-Box Release)' }}
          files: dist/WaZixwx-MMM-Studio-Linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
